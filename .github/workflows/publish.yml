# Build validation only.
#
# This workflow used to publish the site to OVH. It no longer can: the course
# slides live in static/pdf, which is gitignored (~80 MB), so a fresh checkout
# cannot produce a complete site. Deploying from here would wipe the slides
# online. Publishing is done from the trainer's machine with ./sftp.sh.
name: Build website

on:
  push:
  pull_request:
    branches:
      - master
env:
  THEME_URL: github.com/McShelby/hugo-theme-relearn
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve theme
        run: |
          # No -u: use the theme version pinned in go.mod, the one sftp.sh builds
          # with. The latest theme can require a newer Hugo and break the build.
          hugo mod get $THEME_URL
          # To use PostCSS, we must install the following modules. See:
          # - https://gohugo.io/hugo-pipes/postcss/
          # - https://github.com/google/docsy/tree/main#prerequisites
          npm install postcss postcss-cli autoprefixer
      - name: Build slides (marp)
        run: ./slides/md2pdf.sh
      - name: Build website
        run: |
          hugo --minify
